# GitHub Actions workflow. Lives in .github/workflows/, which is the
# magic folder GitHub scans. Pushing this file is what activates it.
name: tests

# When to run: pushes that land on main, plus every pull request.
# Limiting push to main stops PR branches from running the suite twice
# (once for the branch push, once for the PR).
on:
  push:
    branches: [main]
  pull_request:

# CI currently runs the API suite only, and that is deliberate. The
# public Toolshop instance sits behind Cloudflare bot protection, which
# challenges traffic from datacenter IPs like GitHub's runners, so UI
# tests never reach the app (the API host is not challenged). Rather
# than trying to evade a security control, the plan is to self-host the
# app inside the pipeline with Docker and point the UI suite at
# localhost. Until then, the UI suite runs locally.
jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # The runner ships with Python 3.12, but this project is developed
      # on 3.11. Pin it so CI tests the same thing development tested.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # No venv here on purpose. A venv isolates projects on a long-lived
      # machine, but this VM lives for one job and is destroyed. The
      # frozen requirements.txt reproduces the exact same environment.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the API suite
        run: pytest -m api

      # Rescue the run's outputs before the VM is destroyed. The report,
      # log file, and any failure screenshots become a downloadable zip
      # on the run's page. if: always() matters, because a FAILING run
      # is exactly when these files are worth reading.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: results/
          retention-days: 30
