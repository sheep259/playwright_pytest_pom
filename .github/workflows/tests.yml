# GitHub Actions workflow. Lives in .github/workflows/, which is the
# magic folder GitHub scans. Pushing this file is what activates it.
name: tests

# When to run: pushes that land on main, plus every pull request.
# Limiting push to main stops PR branches from running the suite twice
# (once for the branch push, once for the PR).
on:
  push:
    branches: [main]
  pull_request:

# Two parallel jobs on two fresh VMs. The API suite runs against the
# public API host (not bot-challenged, proven reliable). The UI suite
# self-hosts the app under test on the runner with docker compose,
# because the public site sits behind Cloudflare bot protection that
# challenges datacenter IPs. Testing our own deployment instead of
# evading someone else's security control is the whole design.
jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # The runner ships with Python 3.12, but this project is developed
      # on 3.11. Pin it so CI tests the same thing development tested.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Persist pip's download cache across runs, keyed on a hash of
          # requirements.txt. Change a dependency and the key changes,
          # so a stale cache can never poison a run.
          cache: "pip"

      # No venv here on purpose. A venv isolates projects on a long-lived
      # machine, but this VM lives for one job and is destroyed. The
      # frozen requirements.txt reproduces the exact same environment.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the API suite
        run: pytest -m api

      # Rescue the run's outputs before the VM is destroyed. The report,
      # log file, and any failure screenshots become a downloadable zip
      # on the run's page. if: always() matters, because a FAILING run
      # is exactly when these files are worth reading.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: results/
          retention-days: 30

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      # Start the app under test FIRST. Docker and compose come
      # preinstalled on GitHub's runners. While the containers boot and
      # the Angular dev server compiles in the background, the Python
      # and browser setup below runs, so the waits overlap.
      - name: Start the app under test
        run: docker compose up -d

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chromium only in CI: one engine keeps the pipeline fast, and
      # --with-deps apt-installs the Linux system libraries a bare
      # runner does not have.
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # Same provisioning ritual as local development, plus a readiness
      # gate: MariaDB needs a few seconds to initialize before it will
      # accept the migration. -T because CI has no terminal to attach.
      # cache:clear is NOT optional, the app caches API responses and a
      # cache written before seeding serves ids that no longer exist.
      - name: Seed the database
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -uroot -proot --silent && break
            echo "waiting for mariadb ($i)..."
            sleep 2
          done
          docker compose exec -T laravel-api php artisan migrate:fresh --seed
          docker compose exec -T laravel-api php artisan cache:clear

      # The Angular dev server listens only after its first compile
      # finishes, so wait until the UI actually answers
      - name: Wait for the UI to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200 > /dev/null && exit 0
            echo "waiting for the UI ($i)..."
            sleep 2
          done
          echo "UI never became ready" && exit 1

      # Same two overrides as a local self-hosted run: the env var
      # redirects the API clients, the flag redirects the browser tests
      - name: Run the UI suite against the self-hosted app
        env:
          API_BASE_URL: http://localhost:8091
        run: pytest -m ui --base-url http://localhost:4200

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: results/
          retention-days: 30
