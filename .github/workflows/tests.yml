# GitHub Actions workflow. Lives in .github/workflows/, which is the
# magic folder GitHub scans. Pushing this file is what activates it.
name: tests

# When to run: every push to any branch
on: push

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # The VM starts empty. This official action clones the repo onto it.
      - name: Check out the repo
        uses: actions/checkout@v5

      # The runner ships with Python 3.12, but this project is developed
      # on 3.11. Pin it so CI tests the same thing development tested.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No venv here on purpose. A venv isolates projects on a long-lived
      # machine, but this VM lives for one job and is destroyed. The
      # frozen requirements.txt reproduces the exact same environment.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # API tests only for now, they need no browsers installed
      - name: Run the API suite
        run: pytest -m api
