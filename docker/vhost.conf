# nginx vhost for the Toolshop API, taken from the app's own
# _docker/vhost.conf. Every request falls through try_files to
# index.php and gets handed to PHP-FPM in the laravel-api container,
# which is where the application code actually lives.
server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/public;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
