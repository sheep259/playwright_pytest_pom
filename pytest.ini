[pytest]
testpaths = tests

# pytest-playwright reads this and bakes it into every browser context,
# so tests can just call page.goto("/")
base_url = https://practicesoftwaretesting.com

addopts =
    --html=results/report.html
    --self-contained-html

markers =
    smoke: quick checks that the critical paths are alive
    ui: browser-driven tests
    api: request-level tests against the Toolshop API

# Live logging, so log lines stream to the console during a run.
# File logging is handled by utils/logger.py.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(name)s | %(levelname)s | %(message)s
